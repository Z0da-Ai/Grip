name: Build Android (full app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP="$(ls -t *.zip | head -n1)"
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project
          if [ ! -f project/package.json ]; then
            SUB="$(dirname "$(find project -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)")"
            mv "$SUB" project_real && rm -rf project && mv project_real project
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build the web app
        working-directory: project
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Wrap it as an Android app
        working-directory: project
        run: |
          if [ -d android ]; then mv android android-native; fi
          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Grip com.grip.app --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Apply the Grip icon
        working-directory: project
        run: |
          SRC=android-native/app/src/main/res
          DST=android/app/src/main/res
          if [ ! -f $SRC/drawable-xxxhdpi/ic_launcher_foreground.png ]; then
            echo "No custom icon in this zip, keeping the default one."
            exit 0
          fi
          rm -f $DST/drawable-v24/ic_launcher_foreground.xml
          mkdir -p $DST/drawable $DST/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $DST/drawable-$d
            cp $SRC/drawable-$d/ic_launcher_foreground.png $DST/drawable-$d/
          done
          cp $SRC/drawable/ic_launcher_background.xml $DST/drawable/
          cp $SRC/mipmap-anydpi-v26/ic_launcher.xml $SRC/mipmap-anydpi-v26/ic_launcher_round.xml $DST/mipmap-anydpi-v26/

      - name: Build debug APK
        working-directory: project/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Show errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong' -A4 project/build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: project/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: grip-full-app-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
