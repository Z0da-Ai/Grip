name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          ZIP="$(ls *.zip | head -n1)"
          echo "Using $ZIP"
          unzip -q "$ZIP" -d project

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        working-directory: project/android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Show errors
        if: failure()
        run: |
          {
            echo '## Build errors'
            echo '```'
            grep -E '^e: ' project/build.log | head -40
            grep -A6 'What went wrong' project/build.log | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: project/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: grip-debug-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
